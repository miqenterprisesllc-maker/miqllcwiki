[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Force canonical domain (avoid duplicate indexing between Netlify and custom domain)
[[redirects]]
  from = "https://miqllcwiki.netlify.app/*"
  to = "https://miqllcwiki.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://miqllcwiki.com/*"
  to = "https://miqllcwiki.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.miqllcwiki.com/*"
  to = "https://miqllcwiki.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.miqllcwiki.com/*"
  to = "https://miqllcwiki.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-DNS-Prefetch-Control = "on"